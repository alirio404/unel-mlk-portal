const CORREO = 'soporte@unelmlk.edu.ve';

const dl = (a) => `<dl class="of">${a.map(([t,d]) => `<div><dt>${t}</dt><dd>${d}</dd></div>`).join('')}</dl>`;
const cab = (t, s) => `<div class="pageh"><div class="w"><h1>${t}</h1><p>${s}</p></div></div>`;

const RUTAS = {
  '': {t: 'Inicio', h: () => `

        <h1>Formando el futuro de la Patria desde Lara</h1>

/* ---- Portal académico: Supabase como fuente de verdad ----
   El navegador conserva una caché de UI en localStorage, pero la autenticación,
   los usuarios y los datos académicos viven en Supabase. Nunca se almacenan
   contraseñas ni hashes de contraseñas en el cliente. */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* escAttr: para valores de atributos HTML generados dinámicamente (además de esc, neutraliza acentos graves y saltos de línea) */
const escAttr = s => esc(s).replace(/`/g, '&#96;').replace(/\r?\n/g, ' ');
const LS = {
  g: (k, d) => { try { const v = localStorage.getItem('pt_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  s: (k, v) => { try { localStorage.setItem('pt_' + k, JSON.stringify(v)); } catch (e) {} }
};
let USUARIOS = [];
const guardarU = () => setLocal('usuarios', USUARIOS);
/* Catálogos editables por el administrador desde Portal > Catálogos (se guardan en el navegador) */
const CAT0 = {
  carreras: [],
  unidades: [],
  aulas: [],
  periodos: [],
  secciones: []
};
const cat = k => LS.g(k, CAT0[k]);
let UNIDADES = cat('unidades'); /* [código, nombre, trimestre del plan, carrera] */
const perDe = un => { const P = cat('periodos'), x = UNIDADES.find(y => y[0] === un); return P[((x && x[2]) || 1) - 1] || P[0]; };
const mig = o => Object.fromEntries(Object.entries(o).map(([c, m]) => [c, Object.fromEntries(Object.entries(m).map(([u, v]) => [u + '|' + perDe(u), v]))]));
let NOTAS_MEM = null, OBS_MEM = null; /* se cargan y migran UNA sola vez en cargarMem() */
const notas = () => NOTAS_MEM;
const guardarNotas = () => LS.s('hnotas', NOTAS_MEM);
const sesion = () => { try { return JSON.parse(sessionStorage.getItem('pt_ses')); } catch (e) { return null; } };
function limpiarSesionCompleta(){

/* CSV: escape de celdas (comillas, comas, saltos de línea) y protección contra fórmulas de Excel (=, +, -, @) */
const csvCell = v => { let t = String(v ?? ''); if (/^[=+\-@\t\r]/.test(t) && isNaN(Number(t))) t = "'" + t; return /[",;\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
function descargarCSV(nombre, rows){
  const l = document.createElement('a'); l.href = URL.createObjectURL(new Blob(['\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n')], {type: 'text/csv;charset=utf-8'}));
  l.download = nombre; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(l.href), 1000);
}
/* Separa una línea CSV respetando comillas; el separador puede ser coma, punto y coma o tabulador */
function csvSplit(l){
  const d = l.includes('\t') ? '\t' : (l.split(';').length > l.split(',').length ? ';' : ','), out = []; let cur = '', q = false;
  for (let i = 0; i < l.length; i++) { const ch = l[i];
    if (q) { if (ch === '"') { if (l[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true; else if (ch === d) { out.push(cur.trim()); cur = ''; } else cur += ch; }
  out.push(cur.trim()); return out;
}

function choque(n){

/* Operación especial: cambia la cédula y actualiza TODAS las referencias (notas, asistencia, asignaciones, horarios, chat, solicitudes) */
async function cambiarCedula(t){
  const nueva=(prompt('Cédula actual: '+t.ced+'\nEscribe la NUEVA cédula (6 a 12 dígitos):','')||'').trim();
  if(!nueva)return;
  if(!/^\d{6,12}$/.test(nueva))return alert('La cédula debe tener entre 6 y 12 dígitos.');
  if(nueva===t.ced)return alert('La nueva cédula es igual a la actual.');
  if(USUARIOS.some(x=>x.ced===nueva))return alert('Ya existe una cuenta con esa cédula.');
  if(!confirm('Cambiar la cédula de '+t.nombre+' de '+t.ced+' a '+nueva+'?'))return;
  try{
    const {data,error}=await SB.functions.invoke('admin-usuarios',{body:{accion:'cambiar_cedula',id:t.id,cedula:nueva}});
    if(error)throw error;if(data?.error)throw new Error(data.error);
    if(sessionStorage.getItem('pt_ver')===t.ced)sessionStorage.setItem('pt_ver',nueva);
    if(sessionStorage.getItem('pt_edit')===t.ced)sessionStorage.setItem('pt_edit',nueva);
    await cargarSupabase();ir();
  }catch(err){alert('No se pudo cambiar la cédula: '+(err.message||err));}
}

function programarRefresco(){
  if(!remoteMode) return;
  if(remoteBusy){ refreshQueued=true; return; }
  if(remoteRefreshTimer) return;
  remoteRefreshTimer=setTimeout(async()=>{
    remoteRefreshTimer=0;if(!remoteMode||remoteBusy)return;
    try{await cargarSupabase({ensureRealtime:false});ir();}catch(e){console.error('Supabase realtime refresh',e);}
  },250);
}
async function cargarSupabase({ensureRealtime=true}={}){
  if(remoteBusy){ refreshQueued = true; return; }
  remoteBusy = true;
  try {
    const {data:{session}} = await SB.auth.getSession();
    if (!session) {
      remoteMode=false;
      USUARIOS=[]; NOTICIAS=[]; NOTAS_MEM={}; OBS_MEM={};
      return;
    }
    const base = await Promise.all([
      SB.from('perfiles_directorio').select('*').order('nombre'),
      SB.from('perfiles').select('*').eq('id', session.user.id).maybeSingle(),
      SB.from('carreras').select('*').order('nombre'),
      SB.from('secciones_academicas').select('*').order('carrera').order('codigo'),
      SB.from('unidades').select('*').order('cod'),
      SB.from('salones').select('*').order('nombre'),
      SB.from('periodos').select('*').order('codigo'),
      SB.from('asignaciones').select('*'),
      SB.from('horarios').select('*'),
      SB.from('notas').select('*'),
      SB.from('anuncios').select('*').order('creado_en',{ascending:false}),
      SB.from('solicitudes').select('*').order('creado_en',{ascending:false}),
      SB.from('chats').select('*').order('creado_en',{ascending:true}).limit(500),
      SB.from('asistencias').select('*').order('fecha')
    ]);
    const firstErr = base.find(x=>x.error); if(firstErr) throw firstErr.error;
    const [dir,own,ca,se,un,sa,pe,as,ho,no,an,so,ch,at] = base;
    const profilesById = new Map((dir.data||[]).map(p=>[p.id,p]));
    if(own.data) profilesById.set(own.data.id, {...profilesById.get(own.data.id), ...own.data});
    const profiles=[...profilesById.values()];
    const assignments=as.data||[];
    USUARIOS = profiles.map(p=>perfilLegacy(p,assignments));
    setLocal('usuarios',USUARIOS);
    setLocal('carreras',(ca.data||[]).map(x=>x.nombre));
    setLocal('carreras_meta',ca.data||[]);
    setLocal('secciones',(se.data||[]).map(x=>x.carrera+'|'+x.codigo));
    setLocal('secciones_meta',se.data||[]);
    setLocal('unidades',(un.data||[]).map(x=>[x.cod,x.nom,x.trimestre,x.carrera,x.trayecto,x.uc]));
    setLocal('aulas',(sa.data||[]).map(x=>x.nombre));
    setLocal('aulas_meta',sa.data||[]);
    setLocal('periodos',(pe.data||[]).map(x=>x.codigo));
    setLocal('periodos_meta',pe.data||[]);
    const activePeriod=(pe.data||[]).find(x=>x.activo)?.codigo;
    if(activePeriod) localStorage.setItem('pt_periodo_actual',activePeriod);
    setLocal('asigs',assignments.map(a=>({id:a.id,prof:(profiles.find(p=>p.id===a.profesor_id)||{}).cedula||a.profesor_id,sec:a.carrera+'|'+a.seccion,unidad:a.cod_unidad,periodo:a.periodo}))); 
    setLocal('horarios',(ho.data||[]).map(h=>({id:h.id,sec:h.carrera+'|'+h.seccion,unidad:h.cod_unidad,dia:h.dia,ini:hora5(h.hora_inicio),fin:hora5(h.hora_fin),aula:h.salon||'',tema:h.tema||'',prof:(profiles.find(p=>p.id===h.profesor_id)||{}).cedula||'',periodo:h.periodo}))); 
    const nm={}, om={};
    for(const n of (no.data||[])){
      const c=(profiles.find(p=>p.id===n.estudiante_id)||{}).cedula;
      if(!c) continue;
      (nm[c] ||= {})[n.cod_unidad+'|'+n.periodo]=Number(n.nota);
      if(n.observacion) (om[c] ||= {})[n.cod_unidad+'|'+n.periodo]=n.observacion;
    }
    NOTAS_MEM=nm; OBS_MEM=om; setLocal('hnotas',nm); setLocal('hobs',om);
    NOTICIAS=(an.data||[]).map(n=>({id:n.id,titulo:n.titulo,texto:n.cuerpo,fecha:new Date(n.creado_en).toLocaleDateString('es-VE')})); setLocal('noticias',NOTICIAS);
    setLocal('sols',(so.data||[]).map(x=>({id:x.id,ced:(profiles.find(p=>p.id===x.estudiante_id)||{}).cedula||x.estudiante_id,tipo:x.tipo,texto:x.motivo,estado:x.estado,resp:x.respuesta||'',ts:tsMs(x.creado_en)})));
    setLocal('chat',(ch.data||[]).map(x=>({id:x.id,uid:x.remitente_id,sala:x.sala,ced:(profiles.find(p=>p.id===x.remitente_id)||{}).cedula||'',nombre:x.remitente_nombre||((profiles.find(p=>p.id===x.remitente_id)||{}).nombre)||'Usuario',texto:x.texto,aviso:!!x.es_aviso,ts:tsMs(x.creado_en)})));
    const AA={}; for(const x of (at.data||[])){ const c=(profiles.find(p=>p.id===x.estudiante_id)||{}).cedula; if(c) (AA[x.cod_unidad+'|'+x.fecha] ||= {})[c]=x.estado; } setLocal('asis',AA);
    const me=profiles.find(p=>p.id===session.user.id);
    if(me?.rol==='admin'){
      const audit=await SB.from('auditoria').select('*').order('creado_en',{ascending:false}).limit(30);
      if(!audit.error) setLocal('bitacora',(audit.data||[]).map(x=>new Date(x.creado_en).toLocaleString('es-VE')+' - '+x.accion+' · '+x.tabla_afectada));
    } else setLocal('bitacora',[]);
    sessionStorage.setItem('pt_ses',JSON.stringify({id:session.user.id}));
    remoteMode=true;
    UNIDADES=cat('unidades');
    if(ensureRealtime) await startRealtime();
  } finally {
    remoteBusy=false;
    if(refreshQueued){ refreshQueued=false; programarRefresco(); }
  }
}
async function startRealtime(){
  if(!remoteMode||realtimeChannel)return;
  try{const {data:{session}}=await SB.auth.getSession();if(session?.access_token)SB.realtime.setAuth(session.access_token);}catch(e){console.warn('Realtime auth',e);}
  const tables=['anuncios','asignaciones','asistencias','carreras','chats','horarios','notas','perfiles','periodos','salones','secciones_academicas','solicitudes','unidades'];
  const ch=SB.channel('unelmlk-portal-db');
  tables.forEach(table=>ch.on('postgres_changes',{event:'*',schema:'public',table},()=>programarRefresco()));
  ch.subscribe(status=>{
    realtimeReady=status==='SUBSCRIBED';
    const nodes=document.querySelectorAll('#rtstate');nodes.forEach(el=>el.textContent=realtimeReady?'● En tiempo real':(status==='CHANNEL_ERROR'||status==='TIMED_OUT'?'⚠ Realtime · reintentando…':'○ Conectando…'));
    if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){
      console.warn('Supabase Realtime',status);
      if(!realtimeRetryTimer){realtimeRetryTimer=setTimeout(()=>{realtimeRetryTimer=0;if(remoteMode){stopRealtime();startRealtime();}},4000);}
    }
  });
  realtimeChannel=ch;
}
function stopRealtime(){
  realtimeReady=false;if(remoteRefreshTimer){clearTimeout(remoteRefreshTimer);remoteRefreshTimer=0;}
  if(realtimeRetryTimer){clearTimeout(realtimeRetryTimer);realtimeRetryTimer=0;}
  if(realtimeChannel){SB.removeChannel(realtimeChannel);realtimeChannel=null;}
}
